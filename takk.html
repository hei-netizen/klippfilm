<!DOCTYPE html>
<html lang="nb"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow">
<title>Takk for bestillingen · klipp</title><link rel="icon" type="image/svg+xml" href="brand/klipp-mark-v4.svg">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Figtree,system-ui,sans-serif;background:#FBFAF7;color:#141218;min-height:100vh;display:grid;place-items:center;padding:40px 24px;text-align:center}
.mk{width:72px;margin:0 auto 26px}h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-0.04em;font-size:clamp(40px,7vw,72px);line-height:.98;margin-bottom:16px}
.g{background:linear-gradient(95deg,#FF6B3D,#E5397F 52%,#6E4BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#6B6775;font-size:18px;max-width:40ch;margin:0 auto}video{width:200px;border-radius:24px;margin:34px auto 0;box-shadow:0 30px 70px -30px rgba(20,18,24,.45)}a{display:inline-block;margin-top:28px;font-weight:700}
/* ===== v2.1 «middelgrunn» (Jona): proff skrift (Schibsted Grotesk), ny logo, én rød aksent ===== */
:root{--coral:#E4352B;--pink:#E4352B;--violet:#E4352B;--grad:linear-gradient(90deg,#E4352B,#E4352B);
  --disp:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--body:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ink:#111111;--bg:#FAFAF8;--bg2:#F1F0EC}
body{letter-spacing:-0.005em}
h1,h2,h3{letter-spacing:-0.04em;font-weight:800}
.g{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:var(--coral)!important}
.stage h1 .g{color:rgba(255,255,255,.6)!important}
.logo{font-weight:800;letter-spacing:-0.055em}
.logo .mk .bar,.mk .bar{transform-origin:7px 26px}
.btn-hot{box-shadow:0 0 0 4px rgba(228,53,43,.14),0 14px 30px -14px rgba(228,53,43,.65)}
.btn-hot:hover{box-shadow:0 0 0 6px rgba(228,53,43,.16),0 18px 36px -14px rgba(228,53,43,.7)}
.opt.on{background:#FDF0EE!important}
.bx.warm,.bx.lilac{background:var(--bg2)!important;border-color:rgba(17,17,17,.08)!important}
.pricebox::before{background:radial-gradient(closest-side,rgba(228,53,43,.38),rgba(228,53,43,.08) 55%,transparent)!important}
.pricebox .incl span svg{stroke:#FF6A5E}
.marq .tr span::after{background:var(--coral)}
.swatches i:nth-child(4){background:#E4352B}
.eyebrow::before{background:var(--coral)}
.mu{color:#9C9AA2}
body,h1,h2,h3,.logo,button,input,textarea{font-family:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}
</style></head>
<body><div><img class="mk" src="brand/klipp-mark-v4.svg" alt="klipp"><h1 id="tt">Takk! <span class="g">Filmen er på vei.</span></h1>
<p>Betalingen er mottatt. Vi lager filmen ut fra det du skrev og nettsiden din, og sender den i en Drive-lenke på e-post.</p><p id="oid" style="font-size:14px;margin-top:10px"></p>
<video src="video/vy.mp4" poster="img/vy-poster.jpg" autoplay muted loop playsinline></video><a href="index.html">&larr; Tilbake</a></div>
<script>
(function(){
  var tt=document.getElementById('tt'),p=document.querySelector('p'),oid=document.getElementById('oid');
  var n='';try{n=(sessionStorage.getItem('klipp_navn')||'').trim().split(/\s+/)[0];var o=JSON.parse(sessionStorage.getItem('klipp_ordre')||'null');if(o&&o.id)oid.textContent='Ordrenummer '+o.id;}catch(e){}
  var hi=n?('Takk, '+n+'! '):'Takk! ';
  var sid=new URLSearchParams(location.search).get('session_id');
  if(sid){
    /* LIVE: sjekk betalingen hos Stripe */
    tt.innerHTML='Sjekker <span class="g">betalingen …</span>';
    fetch('/api/session-status.php?session_id='+encodeURIComponent(sid)).then(function(r){return r.json();}).then(function(j){
      if(j.betalt){tt.innerHTML=hi+'<span class="g">Filmen er på vei.</span>';if(j.ordre)oid.textContent='Ordrenummer '+j.ordre;try{if(window.gtag)gtag('event','purchase',{value:99,currency:'NOK',transaction_id:j.ordre});}catch(e){}}
      else{tt.innerHTML='Betalingen ble <span class="g">ikke fullført.</span>';p.innerHTML='Ingenting er trukket. <a href="betaling.html">Prøv igjen</a>.';}
    }).catch(function(){tt.innerHTML=hi+'<span class="g">Vi sjekker betalingen.</span>';p.textContent='Du får kvittering på e-post så snart betalingen er bekreftet.';});
  }else{
    tt.innerHTML=hi+'<span class="g">Filmen er på vei.</span>';
  }
})();
</script></body></html>
