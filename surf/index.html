<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bølgejakt">
<meta name="theme-color" content="#0f2a3d">
<title>Bølgejakt</title>
<style>
/* Enkel og stram: rette kanter, vanlig skrift, én blå farge. Beste valg → varseltabell → spotliste. */
:root{
  --bg:#ffffff; --surface:#ffffff; --line:#cfd4da; --soft:#f1f3f5;
  --ink:#1b1f24; --muted:#5f6973; --accent:#2a4fc9; --accent-ink:#ffffff;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;
  padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.wrap>*{min-width:0}
button,select,input{font:inherit;color:inherit;border-radius:8px}
a{color:var(--accent)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.where{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);min-width:0}
.where b{color:var(--ink)}
.search{display:flex;gap:0;flex:1 1 220px;min-width:0}
.search input{flex:1;min-width:0;border:1px solid var(--line);padding:6px 10px;background:#fff;border-radius:8px 0 0 8px}
.btn{background:#fff;border:1px solid var(--line);padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.search .btn{border-left:0;border-radius:0 8px 8px 0}
.btn:focus-visible,select:focus-visible,input:focus-visible,tr.srow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.opts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.opts label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.opts select{border:1px solid var(--line);background:#fff;padding:5px 6px;color:var(--ink)}
.opts .btn{margin-left:auto}

/* Beste valg */
.pick{background:var(--accent);color:var(--accent-ink);padding:16px 18px;border-radius:12px;display:grid;gap:8px}
.pick .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.pick h2{margin:0;font-size:26px;line-height:1.1}
.pick dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.pick dt{opacity:.8}
.pick dd{margin:0;font-weight:700}
.pick a{color:#fff}
.pick p{margin:0}

/* Varseltabell *//* Varseltabell */
.fc{background:#fff;border:1px solid var(--line);color:#222;border-radius:12px;overflow:hidden}
.fc-head{padding:14px 16px 10px;display:grid;gap:4px}
.fc-head h3{margin:0;font-size:20px;color:var(--ink)}
.fc-head .sub{font-size:13px;color:var(--muted)}
.fc-head .links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.fc-head a{color:var(--accent)}
.steps{display:flex;margin-top:4px}
.steps .btn{border-radius:0}.steps .btn:first-child{border-radius:8px 0 0 8px}.steps .btn:last-child{border-radius:0 8px 8px 0}
.steps .btn+.btn{border-left:0}
.lang{display:flex}
.lang .btn{border-radius:0}.lang .btn:first-child{border-radius:8px 0 0 8px}.lang .btn:last-child{border-radius:0 8px 8px 0}
.lang .btn+.btn{border-left:0}
.lang .btn.on,.steps .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line);scroll-behavior:smooth;scroll-snap-type:x proximity;scroll-padding-left:116px;cursor:grab;overscroll-behavior-x:contain}
.fc-scroll.drag{cursor:grabbing;scroll-behavior:auto;scroll-snap-type:none;user-select:none}
.fct tr.time td{scroll-snap-align:start}
.fcnav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.fcnav .btn{padding:5px 10px;border-radius:8px}
.fcnav .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fcnav .arrow{font-size:16px;line-height:1;padding:4px 11px}
.fcnav .days{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.fc-scroll{scroll-behavior:auto}}
table.fct{border-collapse:collapse;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;width:max-content;color:#222}
.fct th{text-transform:none;letter-spacing:0;color:#222;position:static;background:none;font-family:inherit}
.fct td{min-width:52px;padding:2px 1px;text-align:center;vertical-align:middle}
.fct th.lab{position:sticky !important;left:0;z-index:2;background:#fff;text-align:right;padding:3px 8px;min-width:100px;font-weight:400;font-size:12px;color:#333;border-right:1px solid #c9cdd2;line-height:1.2}
.fct th.lab small{display:block;font-size:10px;color:#666}
.fct th.day{text-align:center;font-size:14px;font-weight:700;line-height:1.15;padding:6px 0 2px;border-left:1px solid #c9cdd2;background:#fff}
.fct th.day span{display:block;font-weight:700}
.fct th.day .dl{position:sticky;left:112px;display:inline-block;padding:0 6px}
.fct th.day.alt,.fct tr.time td.alt{background:#eceef1}
.fct td.dstart{border-left:1px solid #c9cdd2}
.fct tr.time td{font-size:13px;color:#222;padding:2px 1px 6px}
.fct tr.sep td,.fct tr.sep th{border-top:1px solid #e3e6ea}
.fct td.bs{border-left:2px solid var(--accent)}
.fct td.be{border-right:2px solid var(--accent)}
.fct tr.time td.best{border-top:2px solid var(--accent)}
.fct tr:last-child td.best{border-bottom:2px solid var(--accent)}
.fct svg{display:block;margin:0 auto}
.fct td.dir{font-size:13px;color:#222;padding-top:0}
.fct td.per{font-weight:700;font-size:14px}
.fct td.graph{padding:0;height:78px;vertical-align:bottom;background:linear-gradient(#fdfdfd,#b9bcc0)}
.fct td.kj{color:#fff;font-weight:700;font-size:13px;padding:4px 1px}
.fct td.ws{font-size:12px;line-height:1.1;height:40px;padding:2px}
.ws-off{background:#3c9b47;color:#fff}.ws-xoff{background:#8cc152;color:#14310f}.ws-x{background:#c9cdd1;color:#222}
.ws-xon{background:#8b9097;color:#fff}.ws-on{background:#5b6068;color:#fff}.ws-calm{background:#e6f2df;color:#2b4a24}
.fct td.tide{font-size:11px;line-height:1.25;background:#f4f8fd}
.fct td.tide b{display:block;color:#2f62c0;font-weight:700}
.fct td.wx{font-size:22px;line-height:1;height:34px}
.fct td.temp{font-weight:700}
.fct td.rain{color:#2f62c0;font-size:12px}
.fct tr.sunrise td{background:#fbf3a0;font-size:12px;font-weight:700;height:20px}
.fct tr.sunset td{background:#151515;color:#fff;font-size:12px;font-weight:700;height:20px}
.fct tr.sunrise th,.fct tr.sunset th{font-size:16px}
.fc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px 14px;font-size:11px;color:var(--muted);align-items:center}

.fc-note{padding:0 16px 12px;font-size:12px;color:var(--muted);margin:0}

/* Spotliste */
h2.sec{margin:8px 0 0;font-size:16px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.spots{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.spots th,.spots td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.spots th{background:var(--soft);font-weight:700;font-size:12px}
.spots td.r{padding:2px 4px;width:40px}
.spots td.r svg{display:block}
.spots tr.srow{cursor:pointer}
.spots tr.srow:hover td{background:var(--soft)}
.spots tr.sel td{background:#e7edfb}
.spots tr.out td{color:#9aa1a8}
.spots td.name{font-weight:700;white-space:normal;min-width:130px}
.spots td.name small{display:block;font-weight:400;color:var(--muted)}
.status{color:var(--muted);padding:16px 0}
.err{color:#b3261e}
.skel{height:120px;background:var(--soft);border-radius:12px}
footer{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <h1 class="brand">Bølgejakt</h1>
    <div class="lang" role="group" aria-label="Språk / Language"><button class="btn" type="button" data-lang="no">NO</button><button class="btn" type="button" data-lang="en">EN</button></div>
    <div class="where"><span id="whereTxt">Finner posisjonen din …</span>
      <button class="btn" id="gps" type="button">Min posisjon</button></div>
    <form class="search" id="searchForm">
      <input id="q" type="search" placeholder="Søk sted" autocomplete="off" aria-label="Søk sted">
      <button class="btn" type="submit" id="searchBtn">Søk</button>
    </form>
  </header>

  <div class="opts">
    <label for="skill"><span id="lblSkill">Nivå</span>
      <select id="skill">
        <option value="nybegynner" id="oBeg">Nybegynner</option>
        <option value="middels" id="oMid" selected>Middels</option>
        <option value="erfaren" id="oAdv">Erfaren</option>
      </select></label>
    <label for="maxDrive"><span id="lblDrive">Maks kjøretid</span>
      <select id="maxDrive">
        <option value="1" id="oD1">1 time</option>
        <option value="2" id="oD2">2 timer</option>
        <option value="4" id="oD4" selected>4 timer</option>
        <option value="8" id="oD8">8 timer</option>
      </select></label>
    <label for="when"><span id="lblWhen">Når</span>
      <select id="when">
        <option value="today" id="oToday">I dag</option>
        <option value="tomorrow" id="oTom">I morgen</option>
        <option value="3d" id="o3d" selected>Neste 3 døgn</option>
      </select></label>
    <button class="btn" id="refresh" type="button">Oppdater</button>
  </div>

  <section id="hero"><div class="skel"></div></section>

  <section id="fc"></section>

  <h2 class="sec" id="secSpots">Spots i nærheten</h2>
  <div id="list"><div class="status">Finner spots …</div></div>

  <footer>Data: Open-Meteo, Kartverket, OpenStreetMap/OSRM. <span id="footTxt">Klokkeslett er lokal tid ved spoten.</span> <span id="stamp"></span></footer>
</div>

<script>
// ---------- Språk ----------
let LANG = (()=>{ try{ const v = localStorage.getItem("bj_lang"); if(v) return JSON.parse(v); }catch(e){}
  return /^(nb|nn|no)\b/i.test(navigator.language||"") ? "no" : "en"; })();
const L = (no, en) => LANG==="en" ? en : no;
const dec = (x, d=1) => { const t = x.toFixed(d); return LANG==="en" ? t : t.replace(".",","); };
const DIRS_NO = ["N","NNØ","NØ","ØNØ","Ø","ØSØ","SØ","SSØ","S","SSV","SV","VSV","V","VNV","NV","NNV"];
const DIRS_EN = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => (LANG==="en"?DIRS_EN:DIRS_NO)[Math.round(((d%360)+360)%360/22.5)%16];
const REGION_EN = {"Danmark":"Denmark","Sverige":"Sweden","Tyskland":"Germany","Nederland":"Netherlands","Skottland":"Scotland","Irland":"Ireland",
  "Nord-Irland":"Northern Ireland","Frankrike":"France","Spania":"Spain","Italia":"Italy","Island":"Iceland","Marokko":"Morocco","Sør-Afrika":"South Africa",
  "Brasil":"Brazil","Filippinene":"Philippines","Kina":"China","Sør-Korea":"South Korea","Mosambik":"Mozambique","Kapp Verde":"Cape Verde",
  "Den dominikanske republikk":"Dominican Republic","Belgia":"Belgium","Azorene":"Azores","Sri Lanka (øst)":"Sri Lanka (east)","Sri Lanka (sør)":"Sri Lanka (south)",
  "Sri Lanka (vest)":"Sri Lanka (west)","Jæren":"Jæren, Norway","Sørlandet":"Southern Norway","Østlandet":"Eastern Norway","Stad":"Stad, Norway","Lofoten":"Lofoten, Norway",
  "Surfespot":"Surf spot","Strand":"Beach"};
const regionTxt = r => L(r, REGION_EN[r] || r);
const NOTE_EN = {
  "Solastranden":"Long sandy beach near the airport. Handles little, best on small to medium days.",
  "Hellestø":"Popular beach break with several peaks. Good for all levels on smaller days.",
  "Borestranden":"Lots of space, several sandbars. Easterly wind gives clean conditions.",
  "Reve (Point Perfect)":"Reef and rocks. For experienced surfers, handles bigger swell than the beaches.",
  "Orrestranda":"Long beach, rarely crowded.",
  "Brusand":"A bit more sheltered from the northwest. Often works when northern Jæren is too big.",
  "Ognastranda":"River mouth and sandbars. Likes southwest.",
  "Lista":"Several beaches and reefs around Lista lighthouse. Pick the beach by the wind when you get there.",
  "Sjøsanden, Mandal":"Needs a strong southerly swell. Rare, but close for people in southern Norway.",
  "Saltstein":"The best-known spot in eastern Norway. Rocky beach, works in southwest gales.",
  "Verdens Ende":"Bedrock and rocks at the tip of Tjøme. Needs south/southwest wind swell.",
  "Hoddevik":"The surf capital of western Norway. The bay picks up northwest and west swell.",
  "Ervik":"More exposed than Hoddevik. Best on smaller days with offshore wind from the east/southeast.",
  "Unstad":"Point break and beach. Tide matters a lot here.",
  "Flakstad":"Long sandy beach by the church. Gentle when Unstad is too big.",
  "Desert Point":"Long left over reef. Needs a big southwest swell, best at low tide. For experienced surfers.",
  "Mawi":"Reef with lefts and rights, can barrel. Likes southwest swell and north/northeast wind. Strong currents, for experienced surfers.",
  "Are Guling":"Reef by the beach, both rights and lefts. Boat or paddle out.",
  "Selong Belanak":"Sandy beach in a bay. Gentle waves, popular with beginners.",
  "Seger":"Reef just east of Kuta Lombok. Several peaks, both rights and lefts.",
  "Tanjung Aan (Aan Right)":"Right over reef at the edge of Tanjung Aan bay. Boat from Gerupuk or paddle.",
  "Gerupuk":"Several reefs inside Gerupuk bay (Inside, Outside, Don Don). Sheltered, so it gets less swell and handles big days. Boat from the village.",
  "Ekas Outside":"Exposed right over reef on the east side of Ekas bay. More power than Gerupuk.",
  "Arugam Bay Main Point":"Long right over sand and reef. Best April–October.",
  "Whisky Point":"Gentle right north of Arugam Bay. Best April–October.",
  "Pottuvil Point":"Long right along sand dunes. Best April–October.",
  "Elephant Rock":"Right in a bay south of Arugam Bay. Best April–October.",
  "Peanut Farm":"Two rights, softer than Main Point. Best April–October.",
  "Okanda":"Right by Kumana National Park. Long drive from Arugam Bay.",
  "Weligama":"Gentle beach in a bay, mostly for beginners. Best November–April.",
  "Midigama (Lazy Left / Lazy Right)":"Left and right over reef. Best November–April.",
  "Rams, Midigama":"Powerful right over reef, for experienced surfers. Best November–April.",
  "Kabalana, Ahangama":"A-frame over reef. Best November–April.",
  "Mirissa":"Right over reef on the west side of the bay. Best November–April.",
  "Hiriketiya":"Small horseshoe bay with a left and a beach break. Best November–April.",
  "Polhena, Matara":"Reef just off Matara. Best November–April.",
  "Unawatuna":"Bay near Galle. Best November–April.",
  "Dewata Beach, Galle":"Beach break and reef west of Galle. Best November–April.",
  "Hikkaduwa Main Reef":"Reef with lefts and rights. Best November–April.",
  "Narigama, Hikkaduwa":"Beach break in southern Hikkaduwa. Best November–April."
};
function spotNote(s){
  const base = s.osm ? (s.kind==="surf" ? L("Merket som surfespot i OpenStreetMap.","Tagged as a surf spot in OpenStreetMap.")
                                        : L("Strand som ikke er merket som surfespot, så sjekk lokalt om den bryter.","Beach not tagged as a surf spot, so check locally whether it breaks."))
             : s.noteNo ? L(s.noteNo, NOTE_EN[s.name] || s.noteNo) : L("Kjent surfespot.","Well-known surf spot.");
  const face = s.curated ? "" : " "+L(`Vender omtrent mot ${compass(s.facing)}.`,`Faces roughly ${compass(s.facing)}.`);
  const shel = s.exp && s.exp<1 ? " "+L(`Skjermet: regner med ca. ${Math.round(s.exp*100)} % av swellen ute på havet.`,`Sheltered: assumes about ${Math.round(s.exp*100)}% of the open-ocean swell.`) : "";
  return base + face + shel;
}
// ---------- Håndlagde norske spots ----------
// facing = retningen stranden vender mot havet (grader). swell = sektor bølgene må komme FRA [fra, til] med klokka.
const CURATED = [
  {id:"sola",  name:"Solastranden", region:"Jæren", lat:58.884, lon:5.596, facing:270, swell:[210,320], tide:"alle", max:2.8, note:"Lang sandstrand nær flyplassen. Tåler lite, best på små til mellomstore dager."},
  {id:"hellesto",name:"Hellestø",   region:"Jæren", lat:58.840, lon:5.555, facing:260, swell:[200,310], tide:"mid",  max:3.0, note:"Populær strandbrekk med flere topper. Fin for alle nivå på mindre dager."},
  {id:"bore",  name:"Borestranden", region:"Jæren", lat:58.797, lon:5.548, facing:255, swell:[200,300], tide:"alle", max:3.0, note:"Mye plass, flere sandbanker. Østavind gir rene forhold."},
  {id:"reve",  name:"Reve (Point Perfect)", region:"Jæren", lat:58.762, lon:5.517, facing:240, swell:[200,290], tide:"mid", max:4.0, note:"Rev og stein. For erfarne, tåler større swell enn strendene."},
  {id:"orre",  name:"Orrestranda",  region:"Jæren", lat:58.728, lon:5.525, facing:250, swell:[200,300], tide:"alle", max:3.0, note:"Lang strand, sjelden folksomt."},
  {id:"brusand",name:"Brusand",     region:"Jæren", lat:58.535, lon:5.735, facing:225, swell:[180,280], tide:"alle", max:2.8, note:"Litt mer skjermet for nordvest. Fungerer ofte når nordre Jæren er for stort."},
  {id:"ogna",  name:"Ognastranda",  region:"Jæren", lat:58.517, lon:5.783, facing:215, swell:[180,270], tide:"alle", max:2.8, note:"Elveos og sandbanker. Liker sørvest."},
  {id:"lista", name:"Lista",        region:"Sørlandet", lat:58.109, lon:6.568, facing:250, swell:[190,300], tide:"alle", max:3.2, note:"Flere strender og rev rundt Lista fyr. Velg strand etter vinden når du er der."},
  {id:"mandal",name:"Sjøsanden, Mandal", region:"Sørlandet", lat:58.018, lon:7.468, facing:185, swell:[150,230], tide:"alle", max:2.0, note:"Trenger kraftig sørlig swell. Sjelden, men nær for de på Sørlandet."},
  {id:"saltstein",name:"Saltstein", region:"Østlandet", lat:58.968, lon:9.868, facing:200, swell:[160,250], tide:"alle", max:2.5, note:"Østlandets mest kjente spot. Steinstrand, virker på sørvest-kuling."},
  {id:"verdensende",name:"Verdens Ende", region:"Østlandet", lat:59.068, lon:10.425, facing:190, swell:[150,240], tide:"alle", max:2.2, note:"Svaberg og stein ytterst på Tjøme. Trenger sør/sørvest vindsjø."},
  {id:"hoddevik",name:"Hoddevik",   region:"Stad", lat:62.120, lon:5.148, facing:330, swell:[250,20], tide:"alle", max:3.0, note:"Vestlandets surfehovedstad. Bukta tar imot nordvest og vest-swell."},
  {id:"ervik", name:"Ervik",        region:"Stad", lat:62.168, lon:5.118, facing:300, swell:[240,10], tide:"mid", max:3.2, note:"Mer åpen enn Hoddevik. Best på mindre dager og fralandsvind fra øst/sørøst."},
  {id:"unstad",name:"Unstad",       region:"Lofoten", lat:68.271, lon:13.585, facing:315, swell:[250,30], tide:"mid", max:4.0, note:"Pointbreak og strand. Tidevannet betyr mye her."},
  {id:"flakstad",name:"Flakstad",   region:"Lofoten", lat:68.102, lon:13.233, facing:345, swell:[280,40], tide:"alle", max:3.0, note:"Lang sandstrand ved kirka. Snill når Unstad er for stort."}
].map(s=>({...s, noteNo:s.note, kind:"surf", curated:true, tideApi:true}));

// ---------- Kjente surfespots i resten av verden ----------
// navn|breddegrad|lengdegrad|område|retning mot havet (grader, omtrentlig)|eksponering 0–1|maks høyde m|bruddkvalitet 0–1|merknad (de fire siste er valgfrie)
const WORLD_RAW = `Klitmøller|57.040|8.490|Danmark|315

const SKILL = {
  nybegynner:{a:.3, b:.5, c:1.2, d:1.8},

// ---------- Hjelpere ----------
const $ = s => document.querySelector(s);
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const angDiff = (a,b) => { const d = Math.abs(((a-b)%360+360)%360); return d>180?360-d:d; };
const store = { get(k){try{return JSON.parse(localStorage.getItem("bj_"+k))}catch(e){return null}}, set(k,v){try{localStorage.setItem("bj_"+k,JSON.stringify(v))}catch(e){}} };
const rad = d => d*Math.PI/180;
function distKm(a,b){ const R=6371, dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const x = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Lokal tid per tidssone (spotens egen tid)
const fmtCache = {};
function parts(ms, tz){
  const f = fmtCache[tz] || (fmtCache[tz] = new Intl.DateTimeFormat("sv-SE",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}));
  const s = f.format(new Date(ms)); return {date:s.slice(0,10), hm:s.slice(11,16), h:+s.slice(11,13)};
}
const DAYN = ["søn","man","tir","ons","tor","fre","lør"], DAYN_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const dayName = date => { const [y,m,d] = date.split("-").map(Number); return (LANG==="en"?DAYN_EN:DAYN)[new Date(Date.UTC(y,m-1,d)).getUTCDay()]; };
function dayLabel(ms, tz){
  const d = parts(ms,tz).date;
  if(d===parts(Date.now(),tz).date) return L("I dag","Today");
  if(d===parts(Date.now()+864e5,tz).date) return L("I morgen","Tomorrow");
  const n = dayName(d); return n[0].toUpperCase()+n.slice(1);
}
const fmtDur = s => { const m = Math.round(s/60), u = L("t","h"); if(m<60) return m+" min"; const h=Math.floor(m/60), r=m%60; return r? `${h} ${u} ${r} min` : `${h} ${u}`; };

function band(score){
  if(score>=7) return {c:"var(--s4)", t:"Episk"};
  if(score>=5) return {c:"var(--s3)", t:"Bra"};

function trap(x,a,b,c,d){ if(x<=a||x>=d) return 0; if(x<b) return (x-a)/(b-a); if(x<=c) return 1; return (d-x)/(d-c); }

function scoreHour(spot,h,skill,tideRange){

  let wind = 1;

    else wind = clamp(1-(h.ws-1.5)/5, 0, 1);
    if(h.gust>10 && h.gust>h.ws*1.6) wind *= .9;
  }
  let tide = 1;
  if(spot.tide!=="alle" && h.tideN!=null){
    const n = h.tideN;
    const raw = spot.tide==="lav" ? 1-n : spot.tide==="høy" ? n : 1-Math.abs(n-.5)*2;
    tide = 1 - clamp(tideRange/2, .1, .5)*(1-raw);
  }
  const kind = (spot.kind==="beach" ? BEACH_FACTOR : 1) * (spot.q ?? 1);
  const raw = 10*size*dir*per*wind*tide*kind;
  return {score: raw*(h.day?1:0), raw};
}

// Offentlige Overpass-servere er ofte overbelastet. Prøv én om gangen, med tidsavbrudd.
const OVERPASS = ["https://overpass-api.de/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
async function overpass(q){
  for(const ep of OVERPASS){
    const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 20000);
    try{
      const r = await fetch(ep,{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q)});
      if(r.ok){ const j = await r.json(); clearTimeout(timer); if(!j.remark || j.elements?.length) return j; }
    }catch(e){}
    clearTimeout(timer);
  }
  throw new Error("overpass");
}
// Surfebutikker, skoler og leiesteder er også merket sport=surfing i OSM. De skal ikke med.
const NOT_A_SPOT = /shop|store|school|skole|escuela|escola|[ée]cole|schule|academy|lesson|camp|hostel|hotel|house|lodge|rental|hire|club|klubb|caf[eé]|\bbar\b|outlet|magasin|board|surfboard|tienda|loja|eskola/i;
const BAD_TAGS = ["shop","craft","amenity","office","club","building","healthcare"];
function isSpot(t){
  if(BAD_TAGS.some(k=>t[k])) return false;
  if(t.tourism && t.tourism!=="attraction") return false;
  if(t.leisure && ["sports_centre","fitness_centre","water_park","swimming_pool","pitch"].includes(t.leisure)) return false;
  return !NOT_A_SPOT.test(t.name||"");
}

// Retning per spot lagres for godt (terrenget flytter seg ikke)
async function withFacing(list){
  const memo = store.get("facing") || {};
  const need = list.filter(p=>p.facing==null && memo[p.id]===undefined);
  if(need.length){
    const f = await seaFacing(need);
    need.forEach((p,i)=>{ memo[p.id] = f[i]; });
    store.set("facing", memo);
  }
  return list.map(p=>{
    if(p.facing!=null) return p;
    const facing = memo[p.id];
    if(facing==null) return null; // ikke ved havet
    return {...p, facing, swell:[(facing+290)%360,(facing+70)%360], tide:"alle", max:3.0};
  }).filter(Boolean);
}

function builtInSpots(origin, radiusKm){
  return [...CURATED, ...WORLD].map(s=>({...s, dist:distKm(origin,s)})).filter(s=>s.dist<=radiusKm);
}

// Ekstra spots fra OpenStreetMap. Overpass er ofte treg, så dette kjører i bakgrunnen.
async function osmSpots(origin, radiusKm){
  const key = `osm_${origin.lat.toFixed(1)}_${origin.lon.toFixed(1)}_${radiusKm}`;
  const cached = store.get(key);
  if(cached && Date.now()-cached.t < 14*864e5) return cached.spots;
  const dLat = radiusKm/110.57, dLon = radiusKm/(111.32*Math.cos(rad(origin.lat)));
  const bb = `(${(origin.lat-dLat).toFixed(3)},${(origin.lon-dLon).toFixed(3)},${(origin.lat+dLat).toFixed(3)},${(origin.lon+dLon).toFixed(3)})`;
  const d = await overpass(`[out:json][timeout:25];(nwr["sport"="surfing"]${bb};nwr["natural"="beach"]["name"]${bb};);out center tags qt;`);
  let cands = d.elements.map(e=>{
    const t = e.tags||{}, lat = e.lat ?? e.center?.lat, lon = e.lon ?? e.center?.lon;
    const surf = t.sport==="surfing";
    if(lat==null || (surf && !isSpot(t))) return null;
    const name = t.name || t["name:en"] || (surf ? "Surfespot" : null);
    if(!name) return null;
    return {id:e.type[0]+e.id, name, lat, lon, kind: surf?"surf":"beach", osm:true, region: surf?"Surfespot":"Strand", dist: distKm(origin,{lat,lon})};
  }).filter(c=>c && c.dist<=radiusKm);
  const cell = Math.max(4, radiusKm/14);
  cands.sort((a,b)=> (a.kind==="surf"?0:1)-(b.kind==="surf"?0:1) || a.dist-b.dist);
  const picked = [];
  for(const c of cands){
    if(picked.some(p=>distKm(p,c) < (p.kind==="surf"&&c.kind==="surf" ? 1.5 : cell))) continue;
    picked.push(c);
    if(picked.length >= 30) break;
  }
  store.set(key,{t:Date.now(), spots:picked});
  return picked;
}

const RING_DIST = [1,3], RING_N = 8;   // 16 punkter per spot (Open-Meteo teller hvert punkt)
async function seaFacing(pts){
  const q = [];
  pts.forEach(p=>{ const kx = Math.cos(rad(p.lat))*111.32;
    for(let k=0;k<RING_N;k++){ const b = k*360/RING_N;
      for(const d of RING_DIST) q.push([(p.lat + d/110.57*Math.cos(rad(b))).toFixed(5), (p.lon + d/kx*Math.sin(rad(b))).toFixed(5)]); } });
  const chunks = [];
  for(let i=0;i<q.length;i+=100) chunks.push(q.slice(i,i+100));
  const res = await Promise.all(chunks.map(ch=>getJSON(`https://api.open-meteo.com/v1/elevation?latitude=${ch.map(c=>c[0]).join(",")}&longitude=${ch.map(c=>c[1]).join(",")}`).then(d=>d.elevation)));
  const el = res.flat(), per = RING_N*RING_DIST.length;
  return pts.map((p,i)=>{
    const w = [];
    for(let k=0;k<RING_N;k++){ let n=0; for(let j=0;j<RING_DIST.length;j++) if(el[i*per+k*RING_DIST.length+j] <= 0.5) n++; w.push(n); }
    const open = w.map((n,k)=>n===RING_DIST.length?k:-1).filter(k=>k>=0);
    const use = open.length ? open : w.map((n,k)=>n>0?k:-1).filter(k=>k>=0);
    if(!use.length) return null;
    let x=0, y=0; use.forEach(k=>{ x += Math.sin(rad(k*360/RING_N))*w[k]; y += Math.cos(rad(k*360/RING_N))*w[k]; });
    return Math.round((Math.atan2(x,y)*180/Math.PI+360)%360);
  });
}


// ---------- Varsel ----------
async function fetchForecast(spots){
  const lat = spots.map(s=>s.lat.toFixed(4)).join(","), lon = spots.map(s=>s.lon.toFixed(4)).join(",");
  const common = `latitude=${lat}&longitude=${lon}&timezone=auto&timeformat=unixtime&forecast_days=4`;
  const [marine, wx] = await Promise.all([
    getJSON(`https://marine-api.open-meteo.com/v1/marine?${common}&hourly=wave_height,wave_direction,wave_period,swell_wave_period,swell_wave_peak_period,sea_level_height_msl&cell_selection=sea`),
    getJSON(`https://api.open-meteo.com/v1/forecast?${common}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code,temperature_2m,precipitation,is_day&daily=sunrise,sunset&wind_speed_unit=ms`)
  ]);
  const M = Array.isArray(marine)?marine:[marine], W = Array.isArray(wx)?wx:[wx];
  const tides = await Promise.all(spots.map(s=>s.tideApi ? fetchTide(s).catch(()=>null) : null));
  return spots.map((s,i)=>buildHours(s, M[i], W[i], tides[i])).filter(f=>f.hours.some(h=>h.h!=null));
}

async function fetchTide(s){
  const day = ms => new Date(ms).toISOString().slice(0,10)+"T00:00";
  const url = `https://vannstand.kartverket.no/tideapi.php?lat=${s.lat}&lon=${s.lon}&fromtime=${day(Date.now()-864e5)}&totime=${day(Date.now()+5*864e5)}&datatype=pre&refcode=cd&lang=nb&interval=60&dst=1&tzone=1&tide_request=locationdata`;
  const r = await fetch(url); if(!r.ok) throw new Error("tide");
  const xml = new DOMParser().parseFromString(await r.text(),"text/xml");
  const out = {};
  xml.querySelectorAll("waterlevel").forEach(w=>{ out[Math.round(Date.parse(w.getAttribute("time"))/36e5)] = parseFloat(w.getAttribute("value"))/100; });
  return Object.keys(out).length ? out : null;
}

function buildHours(spot, m, w, tide){
  const tz = m.timezone || w.timezone || "UTC";
  const sun = {};
  w.daily.time.forEach((t,i)=>{ sun[parts(t*1000,tz).date] = [w.daily.sunrise[i]*1000, w.daily.sunset[i]*1000]; });
  const wIdx = {}; w.hourly.time.forEach((t,i)=>wIdx[t]=i);
  const H = m.hourly;
  const hours = H.time.map((t,i)=>{
    const ms = t*1000, wi = wIdx[t], ss = sun[parts(ms,tz).date];
    const day = ss ? (ms >= ss[0]-30*60e3 && ms <= ss[1]-30*60e3) : true;
    const per = H.swell_wave_peak_period[i] ?? H.swell_wave_period[i] ?? H.wave_period[i] ?? 6;
    const tl = tide ? tide[Math.round(ms/36e5)] : H.sea_level_height_msl?.[i];
    return { ms, h:H.wave_height[i], dir:H.wave_direction[i], per,
      ws: wi!=null ? w.hourly.wind_speed_10m[wi] : null,
      wd: wi!=null ? w.hourly.wind_direction_10m[wi] : null,
      gust: wi!=null ? w.hourly.wind_gusts_10m[wi] : null,
      wcode: wi!=null ? w.hourly.weather_code[wi] : null, temp: wi!=null ? w.hourly.temperature_2m[wi] : null,
      prec: wi!=null ? w.hourly.precipitation[wi] : null, isDay: wi!=null ? w.hourly.is_day[wi]===1 : true,
      tide: tl ?? null, day };
  });
  const tv = hours.map(h=>h.tide).filter(v=>v!=null);
  const tmin = Math.min(...tv), tmax = Math.max(...tv), range = tv.length ? tmax-tmin : 0;
  hours.forEach((h,i)=>{
    h.tideN = h.tide!=null && range>0 ? (h.tide-tmin)/range : null;
    const nx = hours[i+1]; h.tideTrend = nx && nx.tide!=null && h.tide!=null ? (nx.tide>h.tide?"stigende":"fallende") : "";
  });
  return { spot, tz, hours, tideRange: range, tideSrc: tide ? "Kartverket" : "modell", sun };
}

async function fetchDrive(origin, spots){
  try{
    const coords = [[origin.lon,origin.lat], ...spots.map(s=>[s.lon,s.lat])].map(c=>c.map(v=>v.toFixed(5)).join(",")).join(";");
    const d = await getJSON(`https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=duration,distance`);
    return spots.map((s,i)=>({ dur:d.durations[0][i+1], dist:d.distances[0][i+1], est:false }));
  }catch(e){
    // Reserve: luftlinje × 1,3 i 65 km/t
    return spots.map(s=>{ const km = distKm(origin,s)*1.3; return {dur:km/65*3600, dist:km*1000, est:true}; });
  }
}

// ---------- State ----------
const state = {
  origin: null,
  skill: store.get("skill") || "middels",
  maxDrive: store.get("maxDrive") || 4,
  when: store.get("when") || "3d",
  forecast: null, drive: null, loadedRadius: 0, fetchedAt: null, selId: null,
  step: store.get("step")===3 ? 3 : 1
};
if(!RADIUS_KM[state.maxDrive]) state.maxDrive = 4;

// ---------- Analyse ----------
function analyse(){
  const now = Date.now();
  return state.forecast.map((f,i)=>{
    const dr = state.drive[i];
    const driveS = dr && dr.dur!=null ? dr.dur : null;
    const arriveMs = now + (driveS||0)*1000 - 30*60e3; // inntil 30 min inn i timen teller
    const scored = f.hours.map(h=>({...h, ...scoreHour(f.spot,h,state.skill,f.tideRange)}));
    const today = parts(now,f.tz).date, tom = parts(now+864e5,f.tz).date;
    const inHorizon = h => state.when==="today" ? parts(h.ms,f.tz).date===today
      : state.when==="tomorrow" ? parts(h.ms,f.tz).date===tom
      : h.ms >= now-36e5 && h.ms < now+3*864e5;
    let best = null;
    for(let j=0;j<scored.length-1;j++){
      const a = scored[j], b = scored[j+1];
      if(!inHorizon(a) || !a.day || a.ms < arriveMs) continue;
      const sc = b && b.day ? (a.score+b.score)/2 : a.score*0.85;
      if(!best || sc > best.score) best = {score:sc, i:j, start:a.ms, end: b && b.day ? b.ms : a.ms};
    }
    const driveH = driveS!=null ? driveS/3600 : null;
    const value = best ? best.score - (driveH!=null ? driveH*DRIVE_PENALTY : 0) : -99;
    return { ...f, scored, best, driveS, driveH, driveEst: dr?.est, dist: dr?.dist, value,
      inRange: driveH!=null && driveH <= state.maxDrive, inHorizon };
  });
}

const BLUES = ["#9dbcf0","#6c95e6","#4677dd","#2a5ad0","#1c41b7","#132e98","#0b1d73"];
const waveBlue = h => BLUES[Math.min(6, [.5,1,1.5,2,3,4].filter(x=>h>=x).length)];
const kjBlue = e => BLUES[Math.min(6, [100,250,500,900,1500,2500].filter(x=>e>=x).length)];
const energyKJ = (h,t) => Math.round(2.1*h*h*t*t);   // omtrentlig bølgeenergi
const fmtM = v => dec(v,2)+" m";
const DAYFULL_NO = ["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"], DAYFULL_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

// Sirkel med spiss som peker dit bølgene/vinden går
function notch(fromDeg, label, fill){
  return `<svg viewBox="-20 -20 40 40" width="36" height="36" aria-hidden="true"><path transform="rotate(${Math.round(fromDeg+180)})" d="M0-19.5L7-10.95A13 13 0 1 1-7-10.95Z" fill="${fill}"/><text y="4.6" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700" font-family="Helvetica Neue,Arial,sans-serif">${label}</text></svg>`;
}
function starSvg(n){
  const fill = n<=0?"#fff":n<=2?"#fff4c2":n<=4?"#ffe27a":n<=6?"#ffcc3d":n<=8?"#ffad1f":"#ff8a00";
  return `<svg viewBox="0 0 24 24" width="34" height="34" aria-label="${n}/10"><path d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.9l-6.4 3.5 1.4-7.1-5.3-5 7.2-.9z" fill="${fill}" stroke="#9aa3ad" stroke-width=".9" stroke-linejoin="round"/><text x="12" y="15.2" text-anchor="middle" font-size="7.5" font-weight="700" fill="#333" font-family="Helvetica Neue,Arial,sans-serif">${n}</text></svg>`;
}
const GRAPH_H = 78;
const graphY = m => GRAPH_H*(1-Math.sqrt(Math.min(m,10)/10));
function waveSvg(h){
  const top = graphY(h), hp = Math.max(3, GRAPH_H-top), sy = hp/40;
  return `<svg viewBox="0 0 52 ${GRAPH_H}" width="52" height="${GRAPH_H}" preserveAspectRatio="none" aria-hidden="true"><g transform="translate(2 ${top}) scale(1.2 ${sy})"><path d="M0 40C6 39 9 30 13 20C17 9 25 2 33 3C40 4 43 10 40 15C37 11 32 11 30 15C28 21 31 31 40 40Z" fill="${waveBlue(h)}"/><path d="M2 40C9 37 13 28 18 22C23 17 29 19 34 40Z" fill="#fff" opacity=".3"/></g></svg>`;
}
function graphScale(){
  const t = [[10,"10m"],[5,"5m"],[3,"3m"],[1,"1m"],[0,"0m"]];
  return `<svg viewBox="0 0 40 ${GRAPH_H}" width="40" height="${GRAPH_H}" style="display:inline-block;vertical-align:bottom;margin:0">`+
    t.map(([m,l])=>`<text x="30" y="${Math.min(GRAPH_H-1,Math.max(8,graphY(m)+3))}" text-anchor="end" font-size="9" font-weight="700" fill="#333">${l}</text><rect x="32" y="${Math.min(GRAPH_H-1,graphY(m))}" width="6" height="1" fill="#333"/>`).join("")+
    `<rect x="38" y="0" width="1" height="${GRAPH_H}" fill="#333"/></svg>`;
}
function windState(spot,ws,wd){
  if(ws==null) return null;
  if(ws<2) return [L("flau","light"),"ws-calm"];
  const r = windRel(spot,wd);
  return r<=35?[L("fraland","offshore"),"ws-off"]:r<=75?[L("side-<br>fraland","cross-<br>off"),"ws-xoff"]:r<=105?[L("side","cross"),"ws-x"]:r<=145?[L("side-<br>påland","cross-<br>on"),"ws-xon"]:[L("påland","onshore"),"ws-on"];
}
function wxIcon(c,day){
  if(c==null) return "";
  if(c===0) return day?"☀️":"🌙"; if(c===1) return day?"🌤️":"🌙"; if(c===2) return day?"⛅":"☁️"; if(c===3) return "☁️";
  if(c<=48) return "🌫️"; if(c<=57) return "🌦️"; if(c<=67) return "🌧️"; if(c<=77) return "🌨️"; if(c<=82) return "🌦️"; if(c<=86) return "🌨️"; return "⛈️";
}

function renderForecast(r){
  const el = $("#fc");
  if(!r){ el.innerHTML = ""; return; }
  const tz = r.tz, now = Date.now(), H = r.scored, s = r.spot, step = state.step;
  const cols = H.map((h,i)=>({...h,i})).filter(h=>h.ms >= now-step*36e5 && parts(h.ms,tz).h % step === 0 && h.h!=null);
  if(!cols.length){ el.innerHTML = ""; return; }

  // Høy- og lavvann fra timesserien
  const ext = [];
  for(let i=1;i<H.length-1;i++){
    const a=H[i-1].tide, b=H[i].tide, c=H[i+1].tide;
    if(a==null||b==null||c==null) continue;
    if(b>=a && b>c) ext.push({ms:H[i].ms, hi:true, v:b}); else if(b<=a && b<c) ext.push({ms:H[i].ms, hi:false, v:b});
  }
  const inCol = (c,ms) => ms>=c.ms && ms<c.ms+step*36e5;

  const days = [];
  cols.forEach(c=>{ const d = parts(c.ms,tz).date, last = days[days.length-1];
    if(last && last.date===d) last.n++; else days.push({date:d, ms:c.ms, n:1}); c.dayIdx = days.length-1; });
  const inBest = c => r.best && c.ms + step*36e5 > r.best.start && c.ms <= r.best.end;
  const cls = (c, extra="") => { const j = cols.indexOf(c), ib = inBest(c); const k = [extra, (c.dayIdx>0 && parts(c.ms,tz).h===0)?"dstart":"", ib?"best":"", ib && !(j>0 && inBest(cols[j-1]))?"bs":"", ib && !(j<cols.length-1 && inBest(cols[j+1]))?"be":""].filter(Boolean).join(" "); return k?`class="${k}"`:""; };
  const row = (label, fn, rowCls="") => `<tr${rowCls?` class="${rowCls}"`:""}><th class="lab" scope="row">${label}</th>${cols.map(fn).join("")}</tr>`;

  const dayHead = days.map((d,k)=>{
    const [y,m,dd] = d.date.split("-").map(Number), wd = new Date(Date.UTC(y,m-1,dd)).getUTCDay();
    return `<th class="day${k%2?" alt":""}" colspan="${d.n}"><div class="dl"><span>${(f=>d.n>=2?f[wd]:f[wd].slice(0,3))(LANG==="en"?DAYFULL_EN:DAYFULL_NO)}</span>${dd}</div></th>`;
  }).join("");
  const sunAt = (c, idx) => { const sun = r.sun[parts(c.ms,tz).date]; return sun && inCol(c, sun[idx]) ? parts(sun[idx],tz).hm : "–"; };
  const rain = c => { let t=0, any=false; for(let k=0;k<step;k++){ const v = H[c.i+k]?.prec; if(v!=null){ t+=v; any=true; } } return any ? (t<0.1 ? "–" : t<1 ? dec(t,1) : Math.round(t)) : "–"; };

  el.innerHTML = `<div class="fc">
    <div class="fc-head">
      <h3>${esc(s.name)}</h3>
      <div class="sub">${esc(regionTxt(s.region))} · ${L("vender mot","faces")} ${compass(s.facing)} · ${driveTxt(r)} ${L("kjøring","drive")} · ${L("tidevann","tide")}: ${r.tideSrc==="Kartverket"?"Kartverket":L("modell","model")} · ${L("lokal tid","local time")}</div>
      <div class="links">${links(r)}</div>
      <div class="steps" role="group" aria-label="${L("Oppløsning","Resolution")}">${[[3,L("Hver 3. time","Every 3 hours")],[1,L("Hver time","Hourly")]].map(([v,t])=>`<button type="button" class="btn${step===v?" on":""}" data-step="${v}" aria-pressed="${step===v}">${t}</button>`).join("")}</div>
      <div class="fcnav">
        <button type="button" class="btn arrow" data-nav="-1" aria-label="${L("Bla bakover","Scroll back")}">‹</button>
        <div class="days">${days.map((d,k)=>`<button type="button" class="btn" data-day="${k}">${dayLabel(d.ms,tz)}</button>`).join("")}</div>
        <button type="button" class="btn arrow" data-nav="1" aria-label="${L("Bla fremover","Scroll forward")}">›</button>
        ${r.best?`<button type="button" class="btn" data-nav="best">${L("Beste vindu","Best window")}</button>`:""}
      </div>
    </div>
    <div class="fc-scroll" tabindex="0" aria-label="${L("Varseltabell, bla sidelengs","Forecast table, scroll sideways")}"><table class="fct">
      <thead><tr><th class="lab"></th>${dayHead}</tr></thead>
      <tbody>
        ${row("", c=>`<td ${cls(c, c.dayIdx%2?"alt":"")} data-d="${c.dayIdx}">${parts(c.ms,tz).hm.slice(0,2)}</td>`, "time")}
        ${row(`Rating<small>(${L("10 maks","max 10")})</small>`, c=>`<td ${cls(c)}>${starSvg(Math.round(c.raw))}</td>`, "sep")}
        ${row(L("Bølgehøyde (m)","Wave height (m)"), c=>`<td ${cls(c)}>${notch(c.dir, dec(c.h), waveBlue(c.h))}</td>`, "sep")}
        ${row(L("Retning","Direction"), c=>`<td ${cls(c,"dir")}>${compass(c.dir)}</td>`)}
        ${row(L("Periode (s)","Period (s)"), c=>`<td ${cls(c,"per")}>${Math.round(c.per)}</td>`)}
        ${row(`${L("Bølgegraf","Wave graph")} ${graphScale()}`, c=>`<td ${cls(c,"graph")}>${waveSvg(c.h)}</td>`)}
        ${row(L("Energi (kJ)","Energy (kJ)"), c=>{ const e = energyKJ(c.h,c.per); return `<td ${cls(c,"kj")} style="background:${kjBlue(e)}">${e}</td>`; })}
        ${row(L("Vind (m/s)","Wind (m/s)"), c=>`<td ${cls(c)}>${c.ws==null?"–":notch(c.wd, Math.round(c.ws), "#151515")}</td>`, "sep")}
        ${row(L("Vindretning","Wind dir."), c=>`<td ${cls(c,"dir")}>${c.wd==null?"–":compass(c.wd)}</td>`)}
        ${row(L("Vindtype","Wind state"), c=>{ const w = windState(s,c.ws,c.wd); return w ? `<td ${cls(c,"ws "+w[1])}>${w[0]}</td>` : `<td ${cls(c)}>–</td>`; })}
        ${row(L("Høyvann","High tide"), c=>`<td ${cls(c,"tide")}>${ext.filter(e=>e.hi && inCol(c,e.ms)).map(e=>`<b>${parts(e.ms,tz).hm}</b>${fmtM(e.v)}`).join("")}</td>`, "sep")}
        ${row(L("Lavvann","Low tide"), c=>`<td ${cls(c,"tide")}>${ext.filter(e=>!e.hi && inCol(c,e.ms)).map(e=>`<b>${parts(e.ms,tz).hm}</b>${fmtM(e.v)}`).join("")}</td>`)}
        ${row(L("Vær","Weather"), c=>`<td ${cls(c,"wx")}>${wxIcon(c.wcode, c.isDay)}</td>`, "sep")}
        ${row("Temp (°C)", c=>`<td ${cls(c,"temp")}>${c.temp==null?"–":Math.round(c.temp)}</td>`)}
        ${row(L("Nedbør (mm)","Rain (mm)"), c=>`<td ${cls(c,"rain")}>${rain(c)}</td>`)}
        ${row(L("☀︎ opp","☀︎ rise"), c=>`<td ${cls(c)}>${sunAt(c,0)}</td>`, "sunrise")}
        ${row(L("☾ ned","☾ set"), c=>`<td ${cls(c)}>${sunAt(c,1)}</td>`, "sunset")}
      </tbody></table></div>
    <div class="fc-legend">
      <span>${L("Spissen på sirklene peker dit bølgene og vinden går. Blå ramme = beste vindu. Bølgehøyde er modellens verdi ute på havet.","The point on each circle shows where the waves and wind are heading. Blue frame = best window. Wave height is the model value out at sea.")}</span>
    </div>
    <p class="fc-note">${esc(spotNote(s))}</p>
  </div>`;
  el.querySelectorAll("[data-step]").forEach(btn=>btn.onclick=()=>{ state.step = +btn.dataset.step; store.set("step",state.step); renderForecast(r); });
  wireTable(el);
}

// Navigasjon i varseltabellen: dagknapper, piler, dra med mus, markering av synlig dag
function wireTable(el){
  const sc = el.querySelector(".fc-scroll"); if(!sc) return;
  const lab = () => el.querySelector(".fct th.lab")?.offsetWidth || 100;
  const timeCells = [...el.querySelectorAll(".fct tr.time td")];
  const go = x => sc.scrollTo({left: Math.max(0, x), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  const toCell = td => td && go(td.offsetLeft - lab());
  const best = el.querySelector(".fct tr.time td.best");
  // Start ved beste vindu uten animasjon
  if(best){ sc.style.scrollBehavior = "auto"; sc.scrollLeft = Math.max(0, best.offsetLeft - lab() - 52); sc.style.scrollBehavior = ""; }
  el.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>toCell(timeCells.find(td=>td.dataset.d===b.dataset.day)));
  el.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{
    if(b.dataset.nav==="best") return best && go(best.offsetLeft - lab() - 52);
    go(sc.scrollLeft + (+b.dataset.nav) * (sc.clientWidth - lab()) * 0.85);
  });
  const mark = () => {
    const x = sc.scrollLeft + lab() + 4;
    const td = timeCells.find(t => t.offsetLeft + t.offsetWidth > x) || timeCells[timeCells.length-1];
    el.querySelectorAll("[data-day]").forEach(b=>b.classList.toggle("on", td && b.dataset.day===td.dataset.d));
  };
  sc.addEventListener("scroll", ()=>requestAnimationFrame(mark), {passive:true}); mark();
  // Dra med musa (berøring og styreflate scroller som vanlig)
  let drag = null;
  sc.addEventListener("pointerdown", e=>{
    if(e.pointerType!=="mouse" || e.button!==0 || e.target.closest("a,button")) return;
    drag = {x:e.clientX, left:sc.scrollLeft, moved:false}; sc.setPointerCapture(e.pointerId);
  });
  sc.addEventListener("pointermove", e=>{
    if(!drag) return;
    const dx = e.clientX - drag.x;
    if(!drag.moved && Math.abs(dx) > 3){ drag.moved = true; sc.classList.add("drag"); }
    if(drag.moved) sc.scrollLeft = drag.left - dx;
  });
  const end = ()=>{ if(!drag) return; const moved = drag.moved; drag = null; sc.classList.remove("drag");
    if(moved){ const x = sc.scrollLeft + lab(); const td = timeCells.find(t => t.offsetLeft + t.offsetWidth/2 > x); if(td) go(td.offsetLeft - lab()); } };
  sc.addEventListener("pointerup", end); sc.addEventListener("pointercancel", end);
  // Piltaster når tabellen har fokus
  sc.addEventListener("keydown", e=>{
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); go(sc.scrollLeft + (e.key==="ArrowRight"?1:-1) * (timeCells[0]?.offsetWidth||52) * 3); }
  });
}

function render(){
  if(!state.forecast) return;
  const rows = analyse();
  renderHero(rows);
  const top = rows.filter(r=>r.best && r.inRange).sort((a,b)=>b.value-a.value)[0] || rows[0];
  if(!rows.some(r=>r.spot.id===state.selId)) state.selId = top?.spot.id;
  renderList(rows);
  renderForecast(rows.find(r=>r.spot.id===state.selId));
  $("#stamp").textContent = state.fetchedAt ? ` ${L("Sist hentet","Updated")} ${new Date(state.fetchedAt).toLocaleTimeString(L("nb-NO","en-GB"),{hour:"2-digit",minute:"2-digit"})}.` : "";
}

// ---------- Posisjon ----------
function setOrigin(o){
  state.origin = o; store.set("origin", o);
  $("#whereTxt").innerHTML = o.gps ? L("Fra <b>din posisjon</b>","From <b>your location</b>") : `${L("Fra","From")} <b>${esc(o.name)}</b>`;
}
function locate(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p=>res({name:"Min posisjon", gps:true, lat:p.coords.latitude, lon:p.coords.longitude}),
      ()=>res(null), {enableHighAccuracy:false, timeout:8000, maximumAge:10*60e3});
  });
}
async function geocode(q){
  const d = await getJSON(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=${L("nb","en")}&q=${encodeURIComponent(q)}`);
  if(!d.length) return null;
  return {name: d[0].display_name.split(",").slice(0,2).join(",").trim(), lat:+d[0].lat, lon:+d[0].lon};
}

// ---------- Lasting ----------
let loadSeq = 0;
function merge(base, extra){
  return [...base, ...extra.filter(e=>!base.some(b=>distKm(b,e) < (e.kind==="beach"?4:2)))];
}
async function showSpots(seq, o, spots){
  spots = spots.sort((a,b)=>a.dist-b.dist).slice(0, MAX_SPOTS);
  const [fc, drive] = await Promise.all([fetchForecast(spots), fetchDrive(o, spots)]);
  if(seq!==loadSeq) return false;
  state.drive = fc.map(f=>drive[spots.indexOf(f.spot)]);
  state.forecast = fc; state.fetchedAt = Date.now();
  render();
  return true;
}
async function loadAll(){
  const seq = ++loadSeq, o = state.origin, R = RADIUS_KM[state.maxDrive];
  state.loadedRadius = R;
  $("#list").innerHTML = `<div class="status">${L(`Finner spots innen ${R} km …`,`Finding spots within ${R} km …`)}</div>`;
  $("#hero").innerHTML = `<div class="skel"></div>`;
  const osmP = osmSpots(o, R).then(withFacing).catch(()=>[]);   // starter med en gang, venter ikke på den
  try{
    let spots = await withFacing(builtInSpots(o, R));
    if(seq!==loadSeq) return;
    if(!spots.length){
      // Ingen kjente spots her: vent på OpenStreetMap
      $("#list").innerHTML = `<div class="status">${L(`Ingen kjente spots innen ${R} km. Leter i OpenStreetMap …`,`No known spots within ${R} km. Searching OpenStreetMap …`)}</div>`;
      spots = await osmP;
      if(seq!==loadSeq) return;
      if(!spots.length){ state.forecast=[]; state.drive=[]; render(); renderEmpty(R); return; }
      await showSpots(seq, o, spots);
      return;
    }
    $("#list").innerHTML = `<div class="status">${L(`Henter varsel for ${spots.length} spots …`,`Loading forecast for ${spots.length} spots …`)}</div>`;
    if(!await showSpots(seq, o, spots)) return;
    // Legg til OSM-spots hvis Overpass svarer
    const extra = await osmP;
    if(seq!==loadSeq || !extra.length) return;
    const merged = merge(spots, extra);
    if(merged.length > spots.length) await showSpots(seq, o, merged);
  }catch(e){
    console.error(e);
    if(seq!==loadSeq) return;
    $("#list").innerHTML = `<div class="status err">${L("Fikk ikke hentet varselet. Sjekk nettet og trykk Oppdater.","Could not load the forecast. Check your connection and tap Refresh.")}</div>`;
    $("#hero").innerHTML = "";
  }
}
function renderEmpty(R){
  $("#hero").innerHTML = "";
  $("#list").innerHTML = `<div class="status">${L(`Fant ingen spots ved havet innen ${R} km. Øk maks kjøretid eller søk et annet sted.`,`No coastal spots within ${R} km. Increase max drive time or search another place.`)}</div>`;
}

// ---------- Oppstart ----------
function applyStatic(){
  document.documentElement.lang = L("nb","en");
  const T = {gps:["Min posisjon","My location"], searchBtn:["Søk","Search"], lblSkill:["Nivå","Level"], oBeg:["Nybegynner","Beginner"],
    oMid:["Middels","Intermediate"], oAdv:["Erfaren","Advanced"], lblDrive:["Maks kjøretid","Max drive"], oD1:["1 time","1 hour"], oD2:["2 timer","2 hours"],
    oD4:["4 timer","4 hours"], oD8:["8 timer","8 hours"], lblWhen:["Når","When"], oToday:["I dag","Today"], oTom:["I morgen","Tomorrow"],
    o3d:["Neste 3 døgn","Next 3 days"], refresh:["Oppdater","Refresh"], secSpots:["Spots i nærheten","Spots nearby"], footTxt:["Klokkeslett er lokal tid ved spoten.","Times are local time at the spot."]};
  for(const [id,[no,en]] of Object.entries(T)){ const e = document.getElementById(id); if(e) e.textContent = L(no,en); }
  $("#q").placeholder = L("Søk sted","Search place"); $("#q").setAttribute("aria-label", L("Søk sted","Search place"));
  document.querySelectorAll("[data-lang]").forEach(b=>{ const on = b.dataset.lang===LANG; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); });
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{
  LANG = b.dataset.lang; try{ localStorage.setItem("bj_lang", JSON.stringify(LANG)); }catch(e){}
  applyStatic(); if(state.origin) setOrigin(state.origin); render();
});
applyStatic();

$("#skill").value = state.skill; $("#maxDrive").value = state.maxDrive; $("#when").value = state.when;
$("#skill").onchange = e=>{ state.skill = e.target.value; store.set("skill",state.skill); render(); };
$("#when").onchange = e=>{ state.when = e.target.value; store.set("when",state.when); render(); };
$("#maxDrive").onchange = e=>{
  state.maxDrive = +e.target.value; store.set("maxDrive",state.maxDrive);
  if(RADIUS_KM[state.maxDrive] > state.loadedRadius) loadAll(); else render();
};
$("#refresh").onclick = async ()=>{ if(state.origin?.gps){ const g = await locate(); if(g) setOrigin(g); } loadAll(); };
$("#gps").onclick = async ()=>{
  $("#whereTxt").textContent = L("Finner posisjonen din …","Finding your location …");
  const g = await locate();
  if(g){ setOrigin(g); loadAll(); }
  else { $("#whereTxt").innerHTML = `<span class="err">${L("Fikk ikke posisjon. Tillat posisjon i nettleseren, eller søk sted.","Could not get your location. Allow location in your browser, or search a place.")}</span>`; }
};
$("#searchForm").onsubmit = async e=>{
  e.preventDefault();
  const q = $("#q").value.trim(); if(!q) return;
  $("#whereTxt").textContent = L("Søker …","Searching …");
  try{ const p = await geocode(q); if(p){ setOrigin(p); $("#q").value=""; loadAll(); } else $("#whereTxt").innerHTML = `<span class="err">${L(`Fant ikke «${esc(q)}»`,`Could not find “${esc(q)}”`)}</span>`; }
  catch(err){ $("#whereTxt").innerHTML = `<span class="err">${L("Søket feilet. Prøv igjen.","Search failed. Try again.")}</span>`; }
};

(async ()=>{
  // #Ericeira i lenken starter fra det stedet uten å spørre om posisjon
  const hash = decodeURIComponent(location.hash.slice(1));
  if(hash){ const p = await geocode(hash).catch(()=>null); if(p){ setOrigin(p); return loadAll(); } }
  const g = await locate();
  if(g) setOrigin(g);
  else {
    const last = store.get("origin");
    if(last && last.lat!=null) setOrigin(last);
    else { setOrigin({name:"Oslo",lat:59.913,lon:10.752}); $("#whereTxt").innerHTML = L(`<span class="err">Fikk ikke posisjon.</span> Viser Oslo. Søk sted eller trykk «Min posisjon».`,`<span class="err">Could not get your location.</span> Showing Oslo. Search a place or tap “My location”.`); }
  }
  loadAll();
})();
</script>
