name: Instagram (daglig kl. 09)

on:
  schedule:
    # Hvert 10. min 07:00–10:50 UTC (= 08–11 vinter / 09–12 sommer i Oslo). GitHub dropper av og til
    # planlagte kjøringer, så flere forsøk sikrer posten. Scriptet poster først etter 09:00 og bare én gang per dag.
    - cron: "*/10 7-10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Testkjøring (lag container, ikke publiser)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: instagram
          sparse-checkout-cone-mode: true
      - run: pip install --quiet requests
      - name: Legg ut dagens video
        env:
          IG_TOKEN: ${{ secrets.KLIPPFILM_IG_TOKEN }}
          IG_USER_ID: ${{ secrets.KLIPPFILM_IG_USER_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          VARSEL_TIL: ${{ secrets.VARSEL_TIL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          VENT: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: python3 instagram/post.py
      - name: Lagre køen
        if: always()
        run: |
          if ! git diff --quiet instagram/ko.json; then
            git config user.name "klippfilm-bot"
            git config user.email "hei@klippfilm.no"
            git add instagram/ko.json
            git commit -m "Instagram: publisert $(date -u +%F)"
            git pull --rebase --quiet
            git push
          fi
